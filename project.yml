# XcodeGen spec: the source of truth for the Xcode project, which is generated
# (scripts/build.sh does it) and never committed.
name: KumaStatus
options:
  bundleIdPrefix: io.github.dewab74
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  KumaKit:
    path: Packages/KumaKit
targets:
  KumaStatus:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: KumaKit
        products: [KumaKit, KumaUI]
      - target: KumaStatusWidget
        embed: true
        codeSign: true
    entitlements:
      path: App/KumaStatus.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(KUMA_APP_GROUP)
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Kuma Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSUIElement: true
        NSHumanReadableCopyright: MIT License
        KumaAppGroup: $(KUMA_APP_GROUP)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [kumastatus]
        NSLocalNetworkUsageDescription: Kuma Status reads your Uptime Kuma status page, which may be on your local network.
        # Homelab Kuma servers are often plain http on a LAN name or IP. The
        # app only ever connects to the one address the user enters.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).KumaStatus
        PRODUCT_NAME: Kuma Status
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSUIElement: YES
  KumaStatusWidget:
    type: app-extension
    platform: macOS
    sources:
      - path: Widget
    dependencies:
      - package: KumaKit
        products: [KumaKit, KumaUI]
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/KumaStatusWidget.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
          - $(KUMA_APP_GROUP)
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Kuma Status
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        KumaAppGroup: $(KUMA_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).KumaStatus.Widget
        PRODUCT_NAME: KumaStatusWidget
        SKIP_INSTALL: YES
schemes:
  KumaStatus:
    build:
      targets:
        KumaStatus: all
        KumaStatusWidget: all
    run:
      config: Debug
    archive:
      config: Release
