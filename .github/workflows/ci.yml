name: build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - run: swift test --package-path Packages/KumaKit -Xswiftc -warnings-as-errors

      # Unsigned, warnings as errors: proves the app and widget compile. A
      # widget only loads from a signed app, so this build is not runnable.
      - run: scripts/build.sh --check
